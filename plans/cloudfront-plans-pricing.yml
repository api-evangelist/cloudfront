note: >-
  CloudFront now sells two ways. The historic model is pure pay-as-you-go
  (per-GB data transfer out and per-10,000 requests, by geography, with a
  perpetual free tier). Since 2025-11-18 it also sells flat-rate plans that bundle
  CloudFront with AWS WAF, Shield DDoS protection, Route 53 DNS, CloudWatch Logs
  ingestion, a TLS certificate, edge compute and S3 storage credits for one
  monthly price with NO overage charges. Prices below are read from the pricing
  page; the allowance tables are read from the developer-guide page. Each
  flat-rate plan covers ONE distribution with up to one apex domain.
plans:
