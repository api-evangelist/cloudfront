    price: 0
    price_display: usage-based
    billing_period: monthly
    included_quota:
      data_transfer_out: 1 TB/month (perpetual AWS Free Tier)
      requests: 10,000,000 HTTP/HTTPS requests per month (perpetual AWS Free Tier)
      invalidations: 1,000 paths per month
    overage: Per-GB data transfer out and per-10,000 requests, priced by edge location geography; volume tiers reduce the unit price.
    limits:
      note: Standard CloudFront service quotas apply; see rate-limits/cloudfront-rate-limits.yml.
    url: https://aws.amazon.com/cloudfront/pricing/
  - name: Free
