  - apiKey
  api_key_in:
  - header
  oauth2_flows: []
  note: >-
    CloudFront has NO OAuth and NO OpenID Connect surface — /.well-known/openid-configuration
    and /.well-known/oauth-authorization-server returned 404 on all five probed hosts
    (well-known/cloudfront-well-known.yml). Authorization is IAM policy evaluated
    against a SigV4-signed request, so there is no scope vocabulary and scopes/ is
    deliberately absent from this repo. The unit of permission is an IAM action
    (cloudfront:CreateDistribution and 166 siblings), enumerated by AWS in the
    machine-readable AWS Service Reference saved at
    smithy/cloudfront-aws-service-reference.json.
