aid: cloudfront
name: CloudFront
description: CloudFront is Amazon Web Services' content delivery network (CDN) for delivering data, video,
  applications, and APIs globally with low latency. This repository is the short-form profile for AWS
  CloudFront; the canonical AWS service profile lives at amazon-cloudfront in the API Evangelist Network.
  CloudFront's API is part of the AWS Service Reference and exposes operations for distributions, origins,
  cache behaviors, invalidations, origin access identities, functions, and Lambda@Edge.
