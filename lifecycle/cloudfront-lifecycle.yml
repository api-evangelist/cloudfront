  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  note: >-
    Honest finding: AWS publishes NO CloudFront-specific API deprecation policy,
    and no operation in the first-party Smithy model carries the
    smithy.api#deprecated trait - not even the streaming-distribution
    (RTMP) surface, which AWS stopped supporting for new distributions. Retirement
    is announced as prose in the document-history table and in AWS service
    announcements, not signalled in the contract or in response headers. An agent
    cannot learn from the API that an operation is on the way out.
  legacy_surfaces:
