  note: >-
    Every request path carries the API version date (/2020-05-31/distribution).
    AWS has added operations - Distribution Tenants, Connection Groups, VPC
    Origins, Trust Stores, Anycast IP Lists, Key Value Stores - inside the same
    dated version rather than cutting a new one, so the version string is not a
    reliable freshness signal. The Smithy model is the freshness signal.
